{% extends "base.html" %}

{% block content %}

<nav id="actions_nav">
  [<a href="{% url 'add_post_view' %}">Send Us A Post</a>]
</nav>

<div id="list_items">
    {% for post in post_list %}
    <div class="list_item" x-data="{ open: false }">

        <div class="post-header"
             hx-get="{{ post.get_absolute_url }}ajax/"
             hx-target="next .list_item_outer"
             hx-swap="innerHTML"
             hx-trigger="click once"
             @click="open = !open">
            <span class="toggle-icon" x-text="open ? '∧' : '∨'">∨</span>
            <a class="permalink-icon" href="{{ post.get_absolute_url }}" title="Permalink" @click.stop>🔗</a>
            <h2 class="post-title">{{ post.title }}</h2>
            <span class="post-meta">by {{ post.created_by }} | {{ post.published_at|date:"D, j M Y" }}</span>
        </div>

        <div class="list_item_outer" x-show="open" x-cloak></div>
    </div>

    {% endfor %}

</div>

{% endblock %}
